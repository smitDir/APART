# nginx reverse-proxy для apart-server. Домен apart247.ru используется только
# под API (лендинг остаётся на radegust.ru/lending/apart/, это не поддомен).
# Скопировать в /etc/nginx/sites-available/apart,
# затем: ln -s /etc/nginx/sites-available/apart /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# После этого: certbot --nginx -d apart247.ru (получит и подключит HTTPS сам)

server {
    listen 80;
    server_name apart247.ru;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
