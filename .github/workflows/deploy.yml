name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.185.68.210
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/apart-server
            git pull --ff-only
            cd server
            npm install --omit=dev
            pm2 restart apart-server --update-env
