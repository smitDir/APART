name: Deploy Static Site with Backup and Rollback 🚀

on:
  push:
    branches:
      - main # Разворачиваем только ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 0: Получение кода из репозитория
      - name: Checkout code 📦
        uses: actions/checkout@v4

      # Шаг 1: Настройка SSH агента (стандартный встроенный способ)
      - name: Setup SSH agent ⚙️
        run: |
          echo ${{ secrets.SSH_PRIVATE_KEY }} | tr -d '\r' > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa
          eval $(ssh-agent -a /tmp/ssh_agent.sock)
          ssh-add $HOME/.ssh/id_rsa

      # Шаг 2: Создание резервной копии перед деплоем 🛡️
      # ВНИМАНИЕ! Этот шаг создаёт архив ТЕКУЩЕЙ директории на виртуальной машине GitHub,
      # а не сервера. При распаковке он полностью перезапишет директорию /var/www/apart247.ru/
      - name: Create backup before deployment 🛡️
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          ARCHIVE_NAME="backup-$TIMESTAMP.tar.gz"
          
          # Подключаемся к серверу и создаем архив ТАМ
          ssh codex_apart247@186.246.50.81 << EOF
            cd /var/www/apart247.ru && tar czf ./backup/$ARCHIVE_NAME html
          EOF
      # Шаг 3: Копирование файлов на сервер ✨
      # Флаг --delete удалит все лишние файлы на сервере.
      - name: Overwrite files on server 📦→💻
        run: |
          rsync -avz \
            --exclude='logs/' \              # Исключаем лог-файлы
            --exclude='*.tar.gz' \          # Не архивируем свои же бэкапы
            --exclude='/backup/*' \         # Защищаем папку с резервными копиями
            --delete ./ codex_apart247@186.246.50.81:/var/www/apart247.ru/html/

      # Шаг 4: Хелс-чек ✅
          if: always() # Этот шаг выполняется ВСЕГДА после развёртывания
          run: |
            HEALTH_ENDPOINT="https://apart247.ru" # Проверка корня сайта
            
            # Ждём до 6 попыток по 10 секунд = максимум 1 минута ожидания
            for i in {1..6}; do
              RESPONSE_CODE=$(curl -o /dev/null -s -w "%{http_code}" "$HEALTH_ENDPOINT")
              
              echo "🔹 Attempt $i: HTTP Code = $RESPONSE_CODE"
          
              if [[ "$RESPONSE_CODE" == "200" ]]; then
                echo "✅ Service is healthy."
                exit 0 # Успешное завершение пайплайна
              fi
          
              sleep 10 # Пауза перед следующей попыткой
            done
          
            echo "❌ Health check failed after multiple attempts."
            exit 1 # Ошибка заставит сработывать следующий шаг отката

      # Шаг 5: Автоматический откат при сбое 🔁
      - name: Rollback on failure 🔁
        if: failure() # Выполняется только если хелс-чек упал
        run: |
          LATEST_BACKUP=$(ssh codex_apart247@186.246.50.81 'ls -t /var/www/apart247.
