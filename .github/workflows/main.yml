name: Deploy Static Site with Backup and Rollback 🚀

on:
  push:
    branches:
      - main # Разворачиваем только ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 0: Получение кода из репозитория
      - name: Checkout code 📦
        uses: actions/checkout@v4

      # Шаг 1: Настройка SSH агента ⚙️
      - name: Setup SSH agent ✨
        run: |
          mkdir -p $HOME/.ssh # <--- Создаём директорию
          chmod 700 $HOME/.ssh # <--- Устанавливаем строгие права

          # Загружаем отпечатки сервера из секрета
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > $HOME/.ssh/known_hosts
          
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > $HOME/.ssh/id_rsa # <--- Кавычки обязательны!
          chmod 600 $HOME/.ssh/id_rsa
          
          # Запускаем агент
          eval $(ssh-agent -a /tmp/ssh_agent.sock)

          # Передаём пароль через stdin
          printf "%s\n" ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }} | ssh-add $HOME/.ssh/id_rsa

      # Шаг 2: Создание резервной копии перед деплоем 🛡️
      # ВАЖНО: Архивирование происходит НА СЕРВЕРЕ
      - name: Create backup before deployment 🛡️
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          ARCHIVE_NAME="backup-$TIMESTAMP.tar.gz"

          ssh codex_apart247@186.246.50.81 << EOF
            cd /var/www/apart247.ru && tar czf ./backup/$ARCHIVE_NAME html
          EOF

      # Шаг 3: Копирование файлов проекта на сервер ✨
      # Флаг --delete удалит все лишние файлы на сервере.
      - name: Overwrite files on server ✨
        run: |
          rsync -avz \
            --exclude='logs/' \              # Исключаем лог-файлы
            --exclude='*.tar.gz' \          # Не архивируем свои же бэкапы
            --exclude='/backup/*' \         # Защищаем папку с резервными копиями
            --delete ./ codex_apart247@186.246.50.81:/var/www/apart247.ru/html/

      # Шаг 4: Хелс-чек ✅
      # ПРОВЕРЬТЕ ЭТОТ URL И СОЗДАЙТЕ ФАЙЛ status НА СЕРВЕРЕ
      # Шаг: Health check ✅
      - name: Health check ✅
        if: always()
        run: |
          HEALTH_ENDPOINT="https://apart247.ru/" # <--- Замените эту строку!
          for i in {1..6}; do
            RESPONSE_CODE=$(curl -o /dev/null -s -w "%{http_code}" "$HEALTH_ENDPOINT")
            echo "🔹 Attempt $i: HTTP Code = $RESPONSE_CODE"
            if [[ "$RESPONSE_CODE" == "200" ]]; then
              echo "✅ Service is healthy."
              exit 0 # Успех!
            fi
            sleep 5 # Пауза между попытками
          done
          echo "❌ Health check failed after multiple attempts."
          exit 1 # Ошибка заставит сработывать откат.

      # Шаг 5: Автоматический откат при сбое 🔁
      - name: Rollback on failure 🔁
        if: failure() # Выполняется только если хелс-чек упал
        run: |
          LATEST_BACKUP=$(ssh codex_apart247@186.246.50.81 'ls -t /var/www/apart247.ru/backup/*.tar.gz | head -n1')

          # Проверяем, существует ли хотя бы одна резервная копия
          if [ -z "$LATEST_BACKUP" ]; then
            echo "No backups found. Skipping rollback."
            exit 0
          fi

          echo "Deployment or health check failed. Rolling back from $LATEST_BACKUP..."

          # Удаляем текущее содержимое сайта
          ssh codex_apart247@186.246.50.81 "rm -rf /var/www/apart247.ru/html/*"

          # Восстанавливаем последнюю версию
          ssh codex_apart247@186.246.50.81 "cd /var/www/apart247.ru && tar xzf \$LATEST_BACKUP html"

          echo "✅ Rollback completed successfully."
